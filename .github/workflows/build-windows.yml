name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller cryptography pytest

      - name: Run the test suite
        # The suite uses temp dirs and loopback sockets only —
        # no admin rights, no external network.
        run: python -m pytest tests/ -q

      - name: Build FreeMove.exe (one-file, windowed)
        run: pyinstaller --noconfirm freemove.spec

      - name: Upload FreeMove.exe as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeMove
          path: dist/FreeMove.exe

      - name: Attach FreeMove.exe to the GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FreeMove.exe
